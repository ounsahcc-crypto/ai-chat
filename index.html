<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1117">
  <title>AI 원어민 회화 친구</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #181c25;
      --panel2: #202532;
      --text: #f5f7fb;
      --muted: #9da6b8;
      --accent: #6ea8fe;
      --border: #303746;
      --user-bubble: #293b58;
      --user-border: #38527a;
      --ai-bubble: #181c25;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; height: 100%; background-color: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; overscroll-behavior: none; }
    button, input, select { font: inherit; color: inherit; }

    .app { max-width: 680px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; position: relative; }
    header { position: sticky; top: 0; z-index: 10; background: rgba(15, 17, 23, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: max(12px, env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 12px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #6ea8fe, #9b7cff); display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
    .header-info { flex: 1; }
    .header-info b { display: block; font-size: 16px; font-weight: 700; }
    .header-info span { display: block; font-size: 12px; color: var(--muted); }
    .header-actions { display: flex; gap: 6px; }
    .btn-icon { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px; }

    main { flex: 1; padding: 16px 14px calc(190px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .msg { display: flex; flex-direction: column; max-width: 86%; }
    .msg.user { align-self: flex-end; }
    .msg.ai { align-self: flex-start; }
    .bubble { padding: 12px 16px; border-radius: 18px; line-height: 1.6; font-size: 16px; word-break: break-word; }
    .user .bubble { background: var(--user-bubble); border: 1px solid var(--user-border); border-bottom-right-radius: 4px; }
    .ai .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    
    .say { font-size: 18px; font-weight: 600; line-height: 1.8; }
    
    /* 루비(후리가나) 스타일 설정 */
    ruby { ruby-position: over; }
    rt { font-size: 10px; color: var(--accent); font-weight: normal; }

    .ko { font-size: 13px; color: var(--muted); margin-top: 6px; }

    .repeat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: #8bb4f7;
      background: rgba(110, 168, 254, 0.1);
      border: 1px solid rgba(110, 168, 254, 0.25);
      border-radius: 8px;
      padding: 5px 10px;
      margin-top: 8px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s, transform 0.1s;
    }
    .repeat:active {
      background: rgba(110, 168, 254, 0.25);
      transform: scale(0.98);
    }

    .controls { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 17, 23, 0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--border); padding: 10px 14px max(14px, env(safe-area-inset-bottom)); z-index: 10; }
    .controls-inner { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .status { text-align: center; font-size: 12px; color: #6ea8fe; min-height: 16px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .mode-select { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13px; outline: none; flex: 1; }
    .mic-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #08111f; border: none; font-size: 22px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
    .mic-btn.listening { background: #e55353; color: #fff; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

    .text-input-wrap { display: flex; gap: 8px; }
    .text-input-wrap input { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 14px; outline: none; }
    .text-input-wrap button { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 0 16px; cursor: pointer; font-size: 14px; }

    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 20; display: none; }
    .overlay.show { display: block; }
    .sheet { position: absolute; right: 0; top: 0; bottom: 0; width: min(480px, 100%); background: var(--bg); padding: 20px 16px 40px; overflow-y: auto; }
    .sheet h2 { margin-bottom: 16px; font-size: 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input, .field select { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; outline: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions { display: flex; gap: 8px; margin-top: 20px; }
    .actions button { flex: 1; padding: 12px; border-radius: 10px; cursor: pointer; border: none; font-weight: 600; }
    .btn-primary { background: var(--accent); color: #08111f; }
    .btn-secondary { background: var(--panel2); border: 1px solid var(--border) !important; color: var(--text); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">🤖</div>
      <div class="header-info">
        <b id="friendTitle">Emma</b>
        <span id="levelTitle">일본어 · 완전 처음</span>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="openSettingsBtn">⚙️ 설정</button>
      </div>
    </header>

    <main id="chat"></main>

    <div class="controls">
      <div class="controls-inner">
        <div class="status" id="status"></div>
        <div class="row">
          <select class="mode-select" id="inputMode">
            <option value="ko">🇰🇷 한국어로 말하기</option>
            <option value="target">🗣️ 학습 언어로 말하기</option>
          </select>
          <button class="mic-btn" id="micBtn">🎙️</button>
        </div>
        <div class="text-input-wrap">
          <input type="text" id="textInput" placeholder="마이크 또는 텍스트로 대화하세요" autocomplete="off" enterkeyhint="send">
          <button id="sendBtn">전송</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2>Gemini 설정</h2>
      <div class="field">
        <label>Google Gemini API Key (필수)</label>
        <input type="password" id="apiKey" placeholder="AIzaSy... 형태로 시작하는 키 입력">
      </div>
      <div class="grid-2">
        <div class="field">
          <label>배울 언어</label>
          <select id="lang">
            <option value="ja" selected>일본어</option>
            <option value="en">영어</option>
            <option value="es">스페인어</option>
            <option value="zh">중국어</option>
            <option value="fr">프랑스어</option>
            <option value="de">독일어</option>
          </select>
        </div>
        <div class="field">
          <label>수준</label>
          <select id="level">
            <option>완전 처음</option>
            <option>단어 몇 개 앎</option>
            <option>짧은 대화 됨</option>
            <option>일상 대화 됨</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>좋아하는 주제</label>
        <input type="text" id="likes" placeholder="예: 여행, 애니, 음식">
      </div>
      <div class="field">
        <label>친구 이름 및 성격</label>
        <input type="text" id="friend" value="Emma, 다정하고 친절함">
      </div>
      <div class="actions">
        <button class="btn-secondary" id="clearBtn">기록 삭제</button>
        <button class="btn-primary" id="saveSettingsBtn">저장 및 대화 시작</button>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const langMap = {
      ja: { name: "일본어", speech: "ja-JP" },
      en: { name: "영어", speech: "en-US" },
      es: { name: "스페인어", speech: "es-ES" },
      zh: { name: "중국어", speech: "zh-CN" },
      fr: { name: "프랑스어", speech: "fr-FR" },
      de: { name: "독일어", speech: "de-DE" }
    };

    const defaults = { apiKey: "", lang: "ja", level: "완전 처음", likes: "", friend: "Emma, 다정하고 친절함" };
    let cfg = { ...defaults }, messages = [], recognition = null, recognizing = false;

    function load() {
      try {
        cfg = { ...defaults, ...JSON.parse(localStorage.getItem("gemini_cfg") || "{}") };
        messages = JSON.parse(localStorage.getItem("gemini_msgs") || "[]");
      } catch {}
      fillForm();
      render();

      if (!cfg.apiKey.trim()) {
        $("overlay").classList.add("show");
        setStatus("⚙️ 설정창에서 Gemini API Key를 입력해 주세요.");
      }
    }

    function fillForm() {
      for (const k in defaults) {
        if ($(k)) $(k).value = cfg[k];
      }
    }

    function readForm() {
      for (const k in defaults) {
        if ($(k)) cfg[k] = $(k).value.trim();
      }
      localStorage.setItem("gemini_cfg", JSON.stringify(cfg));
    }

    function saveMsgs() {
      localStorage.setItem("gemini_msgs", JSON.stringify(messages.slice(-30)));
    }

    function render() {
      $("friendTitle").textContent = (cfg.friend || "AI 친구").split(",")[0];
      $("levelTitle").textContent = `${langMap[cfg.lang].name} · ${cfg.level}`;
      $("chat").innerHTML = "";
      messages.forEach(m => addBubbleUI(m));
      window.scrollTo(0, document.body.scrollHeight);
    }

    function stripHtml(html) {
      const tmp = document.createElement("DIV");
      tmp.innerHTML = html.replace(/<rt>.*?<\/rt>/g, "");
      return tmp.textContent || tmp.innerText || "";
    }

    function addBubbleUI(m) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + m.role;
      const b = document.createElement("div");
      b.className = "bubble";

      const s = document.createElement("div");
      s.className = "say";
      s.innerHTML = m.text;
      b.appendChild(s);

      if (m.ko) {
        const k = document.createElement("div");
        k.className = "ko";
        k.textContent = m.ko;
        b.appendChild(k);
      }

      if (m.role === "ai" && m.repeat) {
        const r = document.createElement("div");
        r.className = "repeat";
        r.innerHTML = "🔊 <b>따라하기:</b> " + m.repeat;
        
        r.onclick = (e) => {
          e.stopPropagation();
          speak(stripHtml(m.repeat));
        };
        
        b.appendChild(r);
      }

      wrap.appendChild(b);
      $("chat").appendChild(wrap);
    }

    function addMessage(role, text, ko = "", repeat = "") {
      const m = { role, text, ko, repeat };
      messages.push(m);
      addBubbleUI(m);
      saveMsgs();
      window.scrollTo(0, document.body.scrollHeight);
    }

    function setStatus(t) {
      $("status").textContent = t;
    }

    function speak(text) {
      const cleanText = stripHtml(text);
      if (!("speechSynthesis" in window) || !cleanText) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(cleanText);
      u.lang = langMap[cfg.lang].speech;
      u.rate = 0.95;

      const voices = speechSynthesis.getVoices();
      const targetLang = u.lang.toLowerCase();
      const voice = voices.find(v => v.lang && v.lang.toLowerCase() === targetLang) ||
                    voices.find(v => v.lang && v.lang.toLowerCase().startsWith(targetLang.split('-')[0]));
      if (voice) u.voice = voice;

      speechSynthesis.speak(u);
    }

    async function callGemini(userInput) {
      if (!cfg.apiKey) {
        $("overlay").classList.add("show");
        throw new Error("API Key가 설정되지 않았습니다.");
      }

      const name = (cfg.friend || "AI 친구").split(",")[0];
      const targetLang = langMap[cfg.lang].name;

      const isJapanese = cfg.lang === "ja";
      const rubyInstruction = isJapanese 
        ? "일본어 한자가 사용된 모든 단어는 반드시 HTML 루비 태그 형식으로 표기해 줘 (예: <ruby>週末<rt>しゅうまつ</rt></ruby>)." 
        : "";

      const promptText = `너는 ${name}이라는 친근한 회화 친구야.
상대방은 한국어가 모국어이고 ${targetLang}를 배우는 중이다. (수준: ${cfg.level}).
사용자의 입력: "${userInput}"

${rubyInstruction}

작업:
1. 사용자가 한 말을 ${targetLang} 문장으로 변환하고, 그 한국어 의미를 정리해 ("userTarget", "userKo").
2. 친구로서 사용자의 말에 응답하는 ${targetLang} 대답 문장과 한국어 번역, 따라해볼 주요 문장을 구성해 ("aiSay", "aiKo", "aiRepeat").

반드시 오직 지정된 JSON 형식만 반환해.`;

      const modelsToTry = ["gemini-1.5-flash", "gemini-1.5-flash-8b"];
      let lastError = null;

      for (const model of modelsToTry) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 12000);

          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cfg.apiKey}`;
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            signal: controller.signal,
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }],
              generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                  type: "OBJECT",
                  properties: {
                    userTarget: { type: "STRING" },
                    userKo: { type: "STRING" },
                    aiSay: { type: "STRING" },
                    aiKo: { type: "STRING" },
                    aiRepeat: { type: "STRING" }
                  },
                  required: ["userTarget", "userKo", "aiSay", "aiKo", "aiRepeat"]
                },
                maxOutputTokens: 400,
                temperature: 0.7
              }
            })
          });

          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            rawText = rawText.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/```$/g, "").trim();

            return JSON.parse(rawText);
          } else {
            const errData = await res.json().catch(() => ({}));
            lastError = new Error(errData.error?.message || `API 오류 (${res.status})`);
          }
        } catch (e) {
          if (e.name === 'AbortError') {
            lastError = new Error("응답 시간이 초과되었습니다.");
          } else {
            lastError = e;
          }
        }
      }

      throw lastError || new Error("Gemini API 호출 실패");
    }

    async function handleUserInput(text) {
      if (!text.trim()) return;
      setStatus("🤖 생각 중…");

      try {
        const reply = await callGemini(text);
        
        addMessage("user", reply.userTarget || text, reply.userKo || "");
        addMessage("ai", reply.aiSay, reply.aiKo, reply.aiRepeat);
        speak(reply.aiSay);
        setStatus("");
      } catch (err) {
        console.error(err);
        addMessage("user", text);
        setStatus(`⚠️ ${err.message}`);
      }
    }

    function startRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        setStatus("이 브라우저는 음성 입력을 지원하지 않아 텍스트 입력창을 이용해 주세요.");
        return;
      }

      if (recognizing) {
        recognition.stop();
        return;
      }

      recognition = new SR();
      recognition.lang = $("inputMode").value === "ko" ? "ko-KR" : langMap[cfg.lang].speech;
      recognition.interimResults = false;

      recognition.onstart = () => {
        recognizing = true;
        $("micBtn").classList.add("listening");
        setStatus("🎙️ 듣고 있습니다…");
      };

      recognition.onresult = e => {
        const t = e.results?.[0]?.[0]?.transcript || "";
        if (t) handleUserInput(t);
      };

      recognition.onerror = e => {
        recognizing = false;
        $("micBtn").classList.remove("listening");
        setStatus("마이크 권한을 확인해 주세요.");
      };

      recognition.onend = () => {
        recognizing = false;
        $("micBtn").classList.remove("listening");
      };

      try { recognition.start(); } catch (e) {}
    }

    $("micBtn").onclick = startRecognition;
    $("sendBtn").onclick = () => {
      const val = $("textInput").value;
      $("textInput").value = "";
      handleUserInput(val);
    };
    $("textInput").onkeydown = e => {
      if (e.key === "Enter") {
        e.preventDefault();
        $("sendBtn").click();
      }
    };

    $("openSettingsBtn").onclick = () => $("overlay").classList.add("show");
    $("saveSettingsBtn").onclick = () => {
      readForm();
      if (!cfg.apiKey) {
        alert("API Key를 입력해 주세요.");
        return;
      }
      $("overlay").classList.remove("show");
      setStatus("");
    };
    $("clearBtn").onclick = () => {
      messages = [];
      saveMsgs();
      render();
      $("overlay").classList.remove("show");
    };

    speechSynthesis?.addEventListener("voiceschanged", () => {});
    load();
  </script>
</body>
</html>
